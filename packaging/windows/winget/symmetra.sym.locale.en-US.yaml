ShortDescription: TypeScript that compiles to GPU machine code
Description: |
  Symmetra is a TypeScript compiler that generates CUDA C++ code for execution on NVIDIA GPUs.

  Features:
  - Write TypeScript → compile to GPU code
  - 3.1M requests/second sustained throughput
  - <20μs P99 latency (batch mode)
  - Zero garbage collection overhead
  - Full ES2022+ language support
  - TLS 1.3 encryption
  - Production-ready with 835+ test assertions

  Install via:
    winget install symmetra.sym

  Or download the installer from:
    https://github.com/JvanDyk/symmetra/releases

  Getting started:
    sym doctor              # verify GPU and CUDA driver
    sym ./server.ts         # compile and run your first server
    sym version             # check installed version

  Full documentation: https://symmetra.dev/docs/getting-started
