name: symmetra
version: "1.0.0"
summary: GPU-accelerated TypeScript server runtime
description: |
  Symmetra compiles TypeScript directly to CUDA for GPU execution.
  Achieve 3.2M RPS peak throughput with async callbacks and lock-free queues.

grade: stable
confinement: classic
base: core22

apps:
  sym:
    command: sym
    plugs:
      - network
      - network-bind
      - hardware-observe
    environment:
      LD_LIBRARY_PATH: $SNAP/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH

parts:
  symmetra:
    plugin: dump
    source: .
    organize:
      sym: bin/sym
    filesets:
      binary:
        - bin/sym
    prime: [binary]
