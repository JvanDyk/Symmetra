<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16162a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="gAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#5af0c4"/>
    </linearGradient>
    <linearGradient id="gAccV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#5af0c4"/>
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
    </pattern>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gBg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative orb top-right -->
  <ellipse cx="1050" cy="120" rx="280" ry="280" fill="#7c6fff" opacity="0.06" filter="url(#glow)"/>
  <ellipse cx="150"  cy="520" rx="200" ry="200" fill="#5af0c4" opacity="0.05" filter="url(#glow)"/>

  <!-- Top accent bar -->
  <rect width="1200" height="4" fill="url(#gAcc)"/>

  <!-- ── Left panel: icon + wordmark ──────────────────────────────────── -->
  <!-- Hexagon icon: center (130, 200), radius ~90 -->
  <polygon points="130,115 207,160 207,252 130,297 53,252 53,160"
           fill="none" stroke="url(#gAccV)" stroke-width="5"
           stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="130" y="200" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="110" font-weight="700"
        fill="url(#gAccV)" filter="url(#glow)">Σ</text>

  <!-- Wordmark -->
  <text x="270" y="240" dominant-baseline="auto"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="80" font-weight="900" letter-spacing="-2"
        fill="#eaeaf5">Symmetra</text>

  <!-- Tagline -->
  <text x="270" y="290"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="26" font-weight="400"
        fill="#7777a0">TypeScript that compiles to GPU machine code</text>

  <!-- Divider -->
  <rect x="60" y="340" width="800" height="1" fill="#25253a"/>

  <!-- ── Stats row ─────────────────────────────────────────────────────── -->
  <!-- Stat 1: 3.1M RPS -->
  <text x="90" y="400"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="42" font-weight="900" fill="#5af0c4">3.1M</text>
  <text x="90" y="430"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="700" fill="#7c6fff" letter-spacing="1">RPS SUSTAINED</text>

  <!-- Divider -->
  <rect x="310" y="375" width="1" height="70" fill="#32324e"/>

  <!-- Stat 2: <20μs -->
  <text x="340" y="400"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="42" font-weight="900" fill="#5af0c4">&lt;20μs</text>
  <text x="340" y="430"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="700" fill="#7c6fff" letter-spacing="1">P99 LATENCY</text>

  <!-- Divider -->
  <rect x="550" y="375" width="1" height="70" fill="#32324e"/>

  <!-- Stat 3: 32 Streams -->
  <text x="580" y="400"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="42" font-weight="900" fill="#5af0c4">32</text>
  <text x="580" y="430"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="700" fill="#7c6fff" letter-spacing="1">CUDA STREAMS</text>

  <!-- Divider -->
  <rect x="740" y="375" width="1" height="70" fill="#32324e"/>

  <!-- Stat 4: Zero GC -->
  <text x="770" y="400"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="42" font-weight="900" fill="#5af0c4">Zero</text>
  <text x="770" y="430"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="700" fill="#7c6fff" letter-spacing="1">GC OVERHEAD</text>

  <!-- ── Divider ────────────────────────────────────────────────────────── -->
  <rect x="60" y="475" width="800" height="1" fill="#25253a"/>

  <!-- ── Feature pills ──────────────────────────────────────────────────── -->
  <!-- Pill 1 -->
  <rect x="60" y="500" width="175" height="44" rx="8"
        fill="rgba(124,111,255,0.1)" stroke="#7c6fff" stroke-width="1.5"/>
  <text x="147" y="527" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="15" font-weight="600" fill="#5af0c4">✓ CUDA Codegen</text>

  <!-- Pill 2 -->
  <rect x="255" y="500" width="155" height="44" rx="8"
        fill="rgba(90,240,196,0.1)" stroke="#5af0c4" stroke-width="1.5"/>
  <text x="332" y="527" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="15" font-weight="600" fill="#7c6fff">✓ TLS 1.3 PSK</text>

  <!-- Pill 3 -->
  <rect x="430" y="500" width="165" height="44" rx="8"
        fill="rgba(124,111,255,0.1)" stroke="#7c6fff" stroke-width="1.5"/>
  <text x="512" y="527" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="15" font-weight="600" fill="#5af0c4">✓ Zero-Copy I/O</text>

  <!-- Pill 4 -->
  <rect x="615" y="500" width="245" height="44" rx="8"
        fill="rgba(90,240,196,0.1)" stroke="#5af0c4" stroke-width="1.5"/>
  <text x="737" y="527" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="15" font-weight="600" fill="#7c6fff">✓ ES2022+ Full Support</text>

  <!-- ── Right-side accent box ──────────────────────────────────────────── -->
  <rect x="940" y="180" width="220" height="270" rx="16"
        fill="rgba(124,111,255,0.06)" stroke="#32324e" stroke-width="1.5"/>

  <!-- Code snippet -->
  <text x="955" y="215"
        font-family="'Courier New',monospace" font-size="13" fill="#7c6fff">import</text>
  <text x="1010" y="215"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">{ serve }</text>
  <text x="1080" y="215"
        font-family="'Courier New',monospace" font-size="13" fill="#7c6fff">from</text>
  <text x="955" y="237"
        font-family="'Courier New',monospace" font-size="13" fill="#c3e88d">'@symmetra/http'</text>

  <text x="955" y="268"
        font-family="'Courier New',monospace" font-size="13" fill="#7c6fff">const</text>
  <text x="1000" y="268"
        font-family="'Courier New',monospace" font-size="13" fill="#82aaff">app</text>
  <text x="1030" y="268"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">=</text>
  <text x="1045" y="268"
        font-family="'Courier New',monospace" font-size="13" fill="#7c6fff">new</text>
  <text x="1078" y="268"
        font-family="'Courier New',monospace" font-size="13" fill="#5af0c4">Router</text>
  <text x="1125" y="268"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">()</text>

  <text x="955" y="300"
        font-family="'Courier New',monospace" font-size="13" fill="#82aaff">app</text>
  <text x="980" y="300"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">.get(</text>
  <text x="1015" y="300"
        font-family="'Courier New',monospace" font-size="13" fill="#c3e88d">'/ping'</text>
  <text x="955" y="322"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">  ctx =&gt;</text>
  <text x="955" y="344"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">    ctx.</text>
  <text x="993" y="344"
        font-family="'Courier New',monospace" font-size="13" fill="#82aaff">json</text>
  <text x="1022" y="344"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">({</text>
  <text x="955" y="366"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">      gpu:</text>
  <text x="1003" y="366"
        font-family="'Courier New',monospace" font-size="13" fill="#7c6fff">true</text>
  <text x="1030" y="366"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">}))</text>

  <text x="955" y="397"
        font-family="'Courier New',monospace" font-size="13" fill="#82aaff">serve</text>
  <text x="991" y="397"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">(app,</text>
  <text x="1026" y="397"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">{</text>
  <text x="955" y="419"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">  port:</text>
  <text x="1000" y="419"
        font-family="'Courier New',monospace" font-size="13" fill="#f78c6c">8080</text>
  <text x="1030" y="419"
        font-family="'Courier New',monospace" font-size="13" fill="#eaeaf5">})</text>

  <!-- URL / CTA at bottom -->
  <text x="600" y="600" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="18" font-weight="600" fill="#55556e">symmetra.dev</text>
</svg>
