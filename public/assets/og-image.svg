<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ogGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5af0c4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0f1e"/>
  
  <!-- Gradient overlay -->
  <rect width="1200" height="630" fill="url(#ogGradient)" opacity="0.1"/>
  
  <!-- Logo hexagon -->
  <polygon points="600,150 750,225 750,375 600,450 450,375 450,225"
           fill="none"
           stroke="url(#ogGradient)"
           stroke-width="4"
           stroke-linejoin="miter"/>
  
  <!-- Sigma -->
  <text x="600" y="330"
        font-family="Arial, sans-serif"
        font-size="200"
        font-weight="bold"
        fill="url(#ogGradient)"
        text-anchor="middle"
        dominant-baseline="middle">Σ</text>
  
  <!-- Title -->
  <text x="600" y="530"
        font-family="Arial, sans-serif"
        font-size="72"
        font-weight="bold"
        fill="white"
        text-anchor="middle">Symmetra</text>
  
  <!-- Subtitle -->
  <text x="600" y="580"
        font-family="Arial, sans-serif"
        font-size="36"
        fill="#9ca3af"
        text-anchor="middle">GPU-Accelerated Server Runtime</text>
</svg>
