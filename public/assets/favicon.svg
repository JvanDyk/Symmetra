<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5af0c4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" fill="#1a1a2e" rx="8"/>
  
  <!-- Hexagon outline -->
  <polygon points="32,8 52,18 52,38 32,48 12,38 12,18"
           fill="none"
           stroke="url(#faviconGradient)"
           stroke-width="1.5"
           stroke-linejoin="miter"/>
  
  <!-- Sigma glyph -->
  <text x="32" y="38"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="url(#faviconGradient)"
        text-anchor="middle"
        dominant-baseline="middle">Σ</text>
</svg>
