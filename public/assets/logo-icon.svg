<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#5af0c4"/>
    </linearGradient>
  </defs>
  <!-- Hexagon: flat-top, inset 3px for stroke -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18"
           fill="none" stroke="url(#g)" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Σ — large, vertically centered in hex (center ~y=32, cap ~68px) -->
  <text x="32" y="46" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="38" font-weight="700"
        fill="url(#g)">Σ</text>
</svg>
