<svg viewBox="0 0 228 66" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#5af0c4"/>
    </linearGradient>
  </defs>

  <!-- Hexagon icon -->
  <polygon points="30,3 54,16 54,44 30,57 6,44 6,16"
           fill="none" stroke="url(#g)" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"/>
  <text x="30" y="43" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="34" font-weight="700"
        fill="url(#g)">Σ</text>

  <!-- SYMMETRA wordmark -->
  <text x="70" y="37"
        font-family="'Courier New',Courier,monospace"
        font-size="20" font-weight="700" letter-spacing="2"
        fill="url(#g)">SYMMETRA</text>

  <!-- Script overlay — italic, white, rotated bottom-left to top-right -->
  <text x="150" y="53"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="17" font-weight="700" font-style="italic"
        fill="#ffffff"
        transform="rotate(-14 150 53)">Script</text>
</svg>
