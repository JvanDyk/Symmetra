<svg viewBox="0 0 380 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face {
        font-family: 'Aurora';
        src: url('data:application/x-font-ttf;base64,') format('truetype');
      }
    </style>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#5af0c4"/>
    </linearGradient>
  </defs>

  <!-- Hexagon icon -->
  <polygon points="30,3 54,16 54,44 30,57 6,44 6,16"
           fill="none" stroke="url(#g)" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"/>
  <text x="30" y="43" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="34" font-weight="700"
        fill="url(#g)">Σ</text>

  <!-- SYMMETRA wordmark in Aurora font — centered vertically -->
  <text x="70" y="44"
        font-family="Aurora, 'Courier New', Courier, monospace"
        font-size="28" font-weight="800" letter-spacing="3"
        fill="url(#g)">SYMMETRA</text>

  <!-- Script overlay — right below SYMMETRA, italic, white, rotated -->
  <text x="205" y="65"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="26" font-weight="900" font-style="italic"
        fill="#ffffff"
        text-anchor="middle"
        transform="rotate(-14 205 65)">Script</text>
</svg>