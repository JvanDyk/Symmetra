  <!-- Wordmark: "Symmetra" -->
  <text x="70" y="40" dominant-baseline="auto"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="26" font-weight="800" letter-spacing="-0.5"
