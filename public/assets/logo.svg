<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5af0c4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagon outline -->
  <polygon points="100,20 170,55 170,125 100,160 30,125 30,55"
           fill="none"
           stroke="url(#logoGradient)"
           stroke-width="2"
           stroke-linejoin="miter"/>

  <!-- Sigma glyph (Σ) -->
  <text x="100" y="120"
        font-family="Arial, sans-serif"
        font-size="80"
        font-weight="bold"
        fill="url(#logoGradient)"
        text-anchor="middle"
        dominant-baseline="middle">Σ</text>
</svg>
