<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symmetra — JS/TS Feature Coverage Matrix</title>
<style>
:root {
  --bg:     #0a0c12; --bg2: #111420; --bg3: #181c2e;
  --border: #252a40; --text: #c8cfe8; --dim: #4a5270;
  --done:   #3dd68c; --partial: #f5c842; --missing: #f06a6a; --na: #4a5270; --cpu: #3ecfcf;
  --accent: #5b8af4; --orange: #f0a84e; --purple: #b07ef8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }

/* ── sticky header ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,12,18,.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: .7rem 1.5rem; display: flex; gap: .8rem; flex-wrap: wrap; align-items: center;
}
h1 { font-size: 1.15rem; font-weight: 700; white-space: nowrap; }
h1 span { color: var(--accent); }

#search {
  flex: 1; min-width: 180px; max-width: 320px;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); padding: .4rem .75rem; font-size: .82rem; outline: none;
}
#search:focus { border-color: var(--accent); }

.filters { display: flex; gap: .4rem; flex-wrap: wrap; }
.fbtn {
  font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  padding: .3rem .7rem; border-radius: 100px; border: 1px solid; cursor: pointer;
  transition: opacity .15s;
}
.fbtn:not(.active) { opacity: .45; }
.fbtn.f-all     { color: var(--text);    border-color: var(--border);  background: var(--bg3); }
.fbtn.f-done    { color: var(--done);    border-color: rgba(61,214,140,.35); background: rgba(61,214,140,.08); }
.fbtn.f-partial { color: var(--partial); border-color: rgba(245,200,66,.35); background: rgba(245,200,66,.08); }
.fbtn.f-missing { color: var(--missing); border-color: rgba(240,106,106,.35); background: rgba(240,106,106,.08); }
.fbtn.f-na      { color: var(--na);      border-color: rgba(74,82,112,.5);  background: var(--bg3); }
.fbtn.f-cpu     { color: var(--cpu);     border-color: rgba(62,207,207,.35); background: rgba(62,207,207,.08); }

#stats { font-size: .75rem; color: var(--dim); white-space: nowrap; }

/* ── main layout ── */
.wrap { max-width: 1400px; margin: 0 auto; padding: 1rem 1.5rem; }

/* ── category ── */
.cat { margin-bottom: 2.5rem; }
.cat-hdr {
  display: flex; align-items: center; gap: .6rem;
  padding: .5rem 0; margin-bottom: .4rem; cursor: pointer; user-select: none;
  border-bottom: 1px solid var(--border);
}
.cat-hdr h2 { font-size: 1rem; font-weight: 700; }
.cat-icon { font-size: 1.1rem; }
.cat-count { font-size: .72rem; color: var(--dim); margin-left: auto; }
.cat-toggle { font-size: .8rem; color: var(--dim); transition: transform .15s; }
.cat-body { overflow: hidden; }

/* ── table ── */
table { width: 100%; border-collapse: collapse; }
thead th {
  font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  color: var(--dim); text-align: left; padding: .4rem .6rem;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
tr.feat { border-bottom: 1px solid rgba(37,42,64,.5); }
tr.feat:hover { background: rgba(91,138,244,.04); }
tr.feat.hidden { display: none; }
td { padding: .4rem .6rem; vertical-align: top; }
td.name { font-size: .82rem; font-weight: 500; min-width: 200px; }
td.name code { font-family: 'JetBrains Mono','Fira Code',monospace; font-size: .78em; color: #7dd3f5; background: var(--bg3); padding: 1px 4px; border-radius: 3px; }
td.notes { font-size: .76rem; color: var(--dim); max-width: 500px; }
td.effort { font-size: .72rem; white-space: nowrap; }
td.phase  { font-size: .72rem; white-space: nowrap; color: var(--orange); }

.badge {
  display: inline-block; font-size: .65rem; font-weight: 700; letter-spacing: .05em;
  padding: 2px 7px; border-radius: 100px; white-space: nowrap;
}
.s-done    { background: rgba(61,214,140,.12); color: var(--done);    border: 1px solid rgba(61,214,140,.3); }
.s-partial { background: rgba(245,200,66,.12); color: var(--partial); border: 1px solid rgba(245,200,66,.3); }
.s-missing { background: rgba(240,106,106,.12);color: var(--missing); border: 1px solid rgba(240,106,106,.3); }
.s-na      { background: var(--bg3);           color: var(--na);      border: 1px solid var(--border); }
.s-cpu     { background: rgba(62,207,207,.12); color: var(--cpu);     border: 1px solid rgba(62,207,207,.3); }

.effort-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; }
.e-xs  { background: var(--done); }
.e-s   { background: #8bcf4a; }
.e-m   { background: var(--partial); }
.e-l   { background: var(--orange); }
.e-xl  { background: var(--missing); }

/* ── progress bar ── */
.progress-wrap { display: flex; gap: 1rem; margin: 1.2rem 0 2rem; align-items: center; flex-wrap: wrap; }
.progress-bar { flex: 1; min-width: 200px; height: 10px; border-radius: 5px; overflow: hidden; display: flex; }
.pb-done    { background: var(--done); }
.pb-partial { background: var(--partial); }
.pb-missing { background: var(--missing); }
.pb-na      { background: var(--border); }
.progress-legend { display: flex; gap: .8rem; flex-wrap: wrap; }
.pl-item { display: flex; align-items: center; gap: .3rem; font-size: .75rem; }
.pl-dot  { width: 10px; height: 10px; border-radius: 50%; }

/* ── cat summary mini-bar ── */
.mini-bar { height: 4px; border-radius: 2px; overflow: hidden; display: flex; margin-bottom: .5rem; }
</style>
</head>
<body>

<!-- sticky top bar -->
<div class="topbar">
  <h1>Symmetra <span>JS/TS Coverage</span></h1>
  <input id="search" type="text" placeholder="Search feature…" oninput="applyFilters()">
  <div class="filters">
    <button class="fbtn f-all active"     onclick="setFilter('all')">All</button>
    <button class="fbtn f-done"           onclick="setFilter('done')">✅ Done</button>
    <button class="fbtn f-partial"        onclick="setFilter('partial')">⚠️ Partial</button>
    <button class="fbtn f-missing"        onclick="setFilter('missing')">🔲 Missing</button>
    <button class="fbtn f-cpu"            onclick="setFilter('cpu')">🔄 CPU-side</button>
    <button class="fbtn f-na"             onclick="setFilter('na')">⛔ N/A</button>
  </div>
  <div id="stats">–</div>
</div>

<div class="wrap">

<!-- progress overview -->
<div style="padding:.8rem 0 0">
  <div class="progress-wrap">
    <div class="progress-bar" id="masterBar"></div>
    <div class="progress-legend">
      <div class="pl-item"><div class="pl-dot" style="background:var(--done)"></div><span id="pct-done">–</span> Done</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--partial)"></div><span id="pct-partial">–</span> Partial</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--missing)"></div><span id="pct-missing">–</span> Missing</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--cpu)"></div><span id="pct-cpu">–</span> CPU-side</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--border)"></div><span id="pct-na">–</span> N/A</div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     DATA — each category is an object with rows.
     status: done | partial | missing | na | cpu
     effort: xs(< 1h) | s(half-day) | m(1-2d) | l(3-5d) | xl(1-2w) | na
     phase: A B C D E F G  (implementation phase)
  ══════════════════════════════════════════════════════════════════════════ -->
<div id="cats"></div>

</div><!-- /wrap -->

<script>
const DATA = [

// ─────────────────────────────────────────────────────────────────────────────
{ cat: "Core Syntax & Values", icon: "📝", rows: [
  { name: "Variable declarations",      code: "let, const, var",        st: "done",    eff: "na",  phase: "",  notes: "All three hoisting semantics emitted as CUDA local vars." },
  { name: "Null / undefined",           code: "null, undefined",         st: "done",    eff: "na",  phase: "",  notes: "undefined → nullptr macro; null → nullptr." },
  { name: "Boolean literals",           code: "true, false",             st: "done",    eff: "na",  phase: "",  notes: "Direct C++ bool." },
  { name: "Integer / float literals",   code: "42, 3.14, 0xFF, 0b101",  st: "done",    eff: "na",  phase: "",  notes: "All numeric bases handled by parser." },

  { name: "BigInt literals",            code: "100n, 0xFFn",             st: "missing", eff: "s",   phase: "A", notes: "Parser sees 100 then bare 'n' identifier. Strip suffix → cast (long long). Already have typedef bigint = long long." },
  { name: "String literals",            code: "'a', \"b\"",               st: "done",    eff: "na",  phase: "",  notes: "Both delimiters parsed; stored as const char* in VRAM." },

  { name: "RegExp literals",            code: "/abc/gi",                  st: "done",    eff: "na",  phase: "",  notes: "Constructs a RegExp{} struct; NFA engine runs on GPU." },
  { name: "Array literals",             code: "[1, 2, 3]",               st: "done",    eff: "na",  phase: "",  notes: "Stack-allocated GpuArray<T> or typed array." },
  { name: "Object literals",            code: "{ a: 1, b: 2 }",         st: "done",    eff: "na",  phase: "",  notes: "Emitted as an anonymous struct. Keys become field names." },
  { name: "Property shorthand",         code: "{ x, y }",               st: "done",    eff: "na",  phase: "",  notes: "Parser expands { x } → { x: x }." },
  { name: "Computed property names",    code: "{ [key]: val }",          st: "missing", eff: "m",   phase: "B", notes: "Needs runtime string→field dispatch. Emittable as switch on known keys." },
  { name: "Spread in object literal",   code: "{ ...a, x: 1 }",         st: "partial", eff: "m",   phase: "C", notes: "Known-field spread works; dynamic spread needs field-by-field copy." },
  { name: "Spread in array literal",    code: "[...a, 4, 5]",           st: "done",    eff: "na",  phase: "",  notes: "" },
]},

// ─────────────────────────────────────────────────────────────────────────────
{ cat: "Operators", icon: "➕", rows: [
  { name: "Arithmetic",                 code: "+ - * / % **",            st: "done",    eff: "na",  phase: "",  notes: "** → powf() CUDA intrinsic." },
  { name: "Increment / Decrement",      code: "++ --",                   st: "done",    eff: "na",  phase: "",  notes: "Pre and post forms." },
  { name: "Comparison",                 code: "=== !== == != < > <= >=", st: "done",    eff: "na",  phase: "",  notes: "=== on strings uses symm_str_eq(); == same." },
  { name: "Logical",                    code: "&& || !",                  st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Nullish coalescing",         code: "??",                       st: "done",    eff: "na",  phase: "",  notes: "Emitted as (a != nullptr ? a : b)." },
  { name: "Optional chaining",         code: "?.  ?.()  ?.[i]",         st: "done",    eff: "na",  phase: "",  notes: "Emitted as null-check guard before access." },
  { name: "Bitwise",                    code: "& | ^ ~ << >> >>>",       st: "done",    eff: "na",  phase: "",  notes: ">>> → unsigned right shift." },
  { name: "Assignment",                 code: "= += -= *= /= %= **=",    st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Bitwise assignment",         code: "&= |= ^= <<= >>= >>>=",   st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Logical assignment",         code: "&&= ||= ??=",             st: "missing", eff: "xs",  phase: "B", notes: "Parser doesn't recognize these compound tokens. Add 3 token types + codegen." },
  { name: "Ternary",                    code: "a ? b : c",               st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Comma operator",             code: "(a, b)",                  st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "typeof",                     code: "typeof x",                st: "done",    eff: "na",  phase: "",  notes: "Compile-time inference from literal kind. Returns correct string." },
  { name: "void",                       code: "void expr",               st: "done",    eff: "na",  phase: "",  notes: "Emits expr; return nullptr." },
  { name: "delete",                     code: "delete obj.x",            st: "na",      eff: "na",  phase: "",  notes: "GPU stack structs have fixed layout; property deletion not meaningful." },
  { name: "in (property check)",        code: "\"x\" in obj",             st: "missing", eff: "s",   phase: "C", notes: "Need symm_obj_has_key() that checks struct field existence at compile time via template specialization." },
  { name: "instanceof",                 code: "x instanceof Foo",         st: "missing", eff: "m",   phase: "C", notes: "Emit a __type_tag field in generated structs; compare tags." },
  { name: "new",                        code: "new Foo()",                st: "done",    eff: "na",  phase: "",  notes: "Stack-allocates struct + calls constructor." },
  { name: "Exponentiation assign",      code: "x **= 2",                 st: "done",    eff: "na",  phase: "",  notes: "" },
]},

// ─────────────────────────────────────────────────────────────────────────────
{ cat: "Control Flow", icon: "🔀", rows: [
  { name: "if / else if / else",        code: "if (c) {} else {}",       st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "switch / case / default",    code: "switch(x){case 1:}",      st: "done",    eff: "na",  phase: "",  notes: "String cases emit symm_str_eq() chain." },
  { name: "for",                        code: "for(let i=0;i<n;i++)",    st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "while",                      code: "while(c){}",              st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "do…while",                   code: "do{}while(c)",            st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "for…of (arrays)",            code: "for(const x of arr)",     st: "done",    eff: "na",  phase: "",  notes: "Emits indexed loop with type-deduced element." },
  { name: "for…of (generators)",        code: "for(const x of gen())",   st: "done",    eff: "na",  phase: "",  notes: "Uses GpuGenState<V> state machine." },
  { name: "for…of (custom iterator)",   code: "[Symbol.iterator]",        st: "partial", eff: "m",   phase: "D", notes: "Works for generators. Custom class iterators need Symbol.iterator dispatch codegen." },
  { name: "for…in",                     code: "for(const k in obj)",     st: "done",    eff: "na",  phase: "",  notes: "Loops over _e[i].k entries of GpuObject." },
  { name: "for await…of",              code: "for await(const x of it)",st: "done",    eff: "na",  phase: "",  notes: "Emits GpuAsyncIterState step-switch state machine." },
  { name: "break",                      code: "break",                   st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "continue",                   code: "continue",                st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Labelled break/continue",    code: "outer: for… break outer", st: "missing", eff: "s",   phase: "B", notes: "Parser needs label statement node; codegen emits goto label_end." },
  { name: "return",                     code: "return val",              st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "throw",                      code: "throw new Error('msg')",  st: "missing", eff: "m",   phase: "A", notes: "Emit: ctx->error_code = 500; symm_strcpy(ctx->error_msg, msg, 256); return; — then batch dispatch reads error_msg and returns 500." },
  { name: "try / catch / finally",      code: "try{}catch(e){}finally{}",st: "missing", eff: "l",   phase: "A", notes: "GPU has no exception stack. Codegen wraps try-body in a do{}while(0) block; sets a bool _threw; catch checks it; finally always runs. No dynamic dispatch across catch boundaries." },
  { name: "Async/await (Tier-1)",       code: "const x = await gpuOp()",st: "done",    eff: "na",  phase: "",  notes: "await stripped; GPU-native ops run synchronously." },
  { name: "Async/await (Tier-3 I/O)",   code: "await fetch(url)",        st: "partial", eff: "xl",  phase: "E", notes: "Split-kernel CPS: architecture designed, io_stage in SymmCtx. Proxy thread + continuation kernel not yet wired for @symmetra/net." },
]},

// ─────────────────────────────────────────────────────────────────────────────
{ cat: "Functions & Closures", icon: "🔧", rows: [
  { name: "Function declarations",      code: "function foo(){}",        st: "done",    eff: "na",  phase: "",  notes: "Emitted as __device__ functions." },
  { name: "Function expressions",       code: "const f = function(){}",  st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Arrow functions",            code: "const f = (x) => x*2",   st: "done",    eff: "na",  phase: "",  notes: "Lexical this captured via lambda if inside class." },
  { name: "Default parameters",         code: "function f(x=0){}",       st: "done",    eff: "na",  phase: "",  notes: "Emitted as C++ default argument values." },
  { name: "Rest parameters",            code: "function f(...args){}",   st: "done",    eff: "na",  phase: "",  notes: "Emitted as fixed-size GpuArray<T,N> on stack." },
  { name: "Spread in call",             code: "f(...arr)",               st: "partial", eff: "s",   phase: "C", notes: "Fixed-size known arrays work; variadic spread needs sizeof expansion." },
  { name: "arguments object",           code: "function f(){ arguments }",st:"na",      eff: "na",  phase: "",  notes: "Legacy feature; GPU functions use rest params instead." },
  { name: "Named function expressions", code: "const f = function g(){}",st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Generator functions",        code: "function* gen(){}",       st: "done",    eff: "na",  phase: "",  notes: "Emitted as GpuGenState<V> switch-case state machine." },
  { name: "Async functions",            code: "async function f(){}",    st: "done",    eff: "na",  phase: "",  notes: "async keyword stripped; becomes __device__ function." },
  { name: "Async generator functions",  code: "async function* gen(){}",  st: "partial", eff: "l",   phase: "D", notes: "Basic structure: GpuAsyncIterState. Full await-inside-generator CPS not implemented." },
  { name: "IIFE",                       code: "(function(){})()",         st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Closures (lexical scope)",   code: "outer var captured",      st: "done",    eff: "na",  phase: "",  notes: "Captured vars become struct fields on GPU closure object." },
  { name: "Hoisting (var)",             code: "var x at top of scope",   st: "partial", eff: "s",   phase: "C", notes: "Codegen declares all vars at top of function; hoisting semantics preserved for simple cases." },
  { name: "Tail call optimization",     code: "return f()",              st: "na",      eff: "na",  phase: "",  notes: "NVRTC does not guarantee TCO; GPU stack is small. Avoid deep recursion." },
]},

// ─────────────────────────────────────────────────────────────────────────────
{ cat: "Classes & OOP", icon: "🏛️", rows: [
  { name: "Class declarations",         code: "class Foo {}",            st: "done",    eff: "na",  phase: "",  notes: "Emitted as __device__ struct with methods." },
  { name: "Class expressions",          code: "const C = class {}",      st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Constructor",                code: "constructor(x){}",        st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Instance methods",           code: "foo() { return 1; }",     st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Static methods",             code: "static bar() {}",         st: "done",    eff: "na",  phase: "",  notes: "Emitted as free __device__ function with class prefix." },
  { name: "extends / super()",          code: "class B extends A {}",    st: "done",    eff: "na",  phase: "",  notes: "struct inheritance; super() calls parent constructor." },

  { name: "Setter methods",             code: "set foo(v) { … }",        st: "missing", eff: "m",   phase: "B", notes: "Same as getter — pair emitted as __device__ getter/setter on the struct." },
  { name: "Private fields (#field)",    code: "#x = 0",                  st: "missing", eff: "s",   phase: "B", notes: "Parser: treat #name as identifier _priv_name. No true encapsulation needed on GPU." },
  { name: "Private methods (#method)",  code: "#doThing(){}",            st: "missing", eff: "s",   phase: "B", notes: "Same naming mangle as private fields." },
  { name: "Static private fields",      code: "static #x = 0",          st: "missing", eff: "s",   phase: "B", notes: "" },
  { name: "Static fields",              code: "static x = 42",           st: "missing", eff: "s",   phase: "B", notes: "Emit as namespace-scoped __device__ variable with class prefix." },
  { name: "Static initializer blocks", code: "static { this.x=1; }",    st: "missing", eff: "m",   phase: "B", notes: "Emit as init function called once from dispatch prelude." },
  { name: "Symbol.iterator on class",  code: "[Symbol.iterator](){}",   st: "done",    eff: "na",  phase: "",  notes: "Parser maps to __iterator__; codegen emits GpuGenState factory." },
  { name: "Symbol.asyncIterator",      code: "[Symbol.asyncIterator]()",st: "done",    eff: "na",  phase: "",  notes: "Parser maps to __asyncIterator__; emits GpuAsyncIterState." },
  { name: "Symbol.toPrimitive",        code: "[Symbol.toPrimitive]()",  st: "partial", eff: "s",   phase: "D", notes: "Parser maps to __toPrimitive__; codegen doesn't yet call it in type-coercion contexts." },
  { name: "Symbol.hasInstance",        code: "[Symbol.hasInstance]()",  st: "partial", eff: "s",   phase: "D", notes: "Parser maps to __hasInstance__; instanceof codegen not wired yet." },
  { name: "Abstract classes (TS)",     code: "abstract class Foo {}",   st: "na",      eff: "na",  phase: "",  notes: "Type-only; erased by esbuild before parsing." },
  { name: "Override keyword (TS)",     code: "override foo(){}",         st: "na",      eff: "na",  phase: "",  notes: "Type-only; erased." },
]},

// ─────────────────────────────────────────────────────────────────────────────
{ cat: "Destructuring & Spread", icon: "📦", rows: [
  { name: "Array destructuring",        code: "const [a,b] = arr",       st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Object destructuring",       code: "const {x,y} = obj",       st: "done",    eff: "na",  phase: "",  notes: "" },
  { name: "Nested destructuring",       code: "const {a:{b}} = obj",     st: "done",    eff: "na",  phase: "",  notes: "" },

// ─────────────────────────────────────────────────────────────────────────────
// Rendering
// ─────────────────────────────────────────────────────────────────────────────

let currentFilter = 'all';

function statusLabel(st) {
  const m = { done:'✅ Done', partial:'⚠️ Partial', missing:'🔲 Missing', na:'⛔ N/A', cpu:'🔄 CPU-side' };
  return m[st] || st;
}
function statusClass(st) {
  return { done:'s-done', partial:'s-partial', missing:'s-missing', na:'s-na', cpu:'s-cpu' }[st] || '';
}
function effortHtml(e) {
  if (e === 'na') return '<span style="color:var(--dim)">—</span>';
  const cols = { xs:'var(--done)', s:'#8bcf4a', m:'var(--partial)', l:'var(--orange)', xl:'var(--missing)' };
  const labels = { xs:'< 1 h', s:'½ day', m:'1–2 d', l:'3–5 d', xl:'1–2 w' };
  return `<span class="effort-dot" style="background:${cols[e]}"></span>${labels[e] || e}`;
}

function render() {
  const container = document.getElementById('cats');
  container.innerHTML = '';

  let totalDone=0, totalPartial=0, totalMissing=0, totalNa=0, totalCpu=0, totalAll=0;

  DATA.forEach((cat, ci) => {
    totalAll += cat.rows.length;
    cat.rows.forEach(r => {
      if (r.st==='done') totalDone++;
      else if (r.st==='partial') totalPartial++;
      else if (r.st==='missing') totalMissing++;
      else if (r.st==='na') totalNa++;
      else if (r.st==='cpu') totalCpu++;
    });

    const pDone    = cat.rows.filter(r=>r.st==='done').length;
    const pPartial = cat.rows.filter(r=>r.st==='partial').length;
    const pMissing = cat.rows.filter(r=>r.st==='missing').length;
    const pNa      = cat.rows.filter(r=>r.st==='na').length;
    const pCpu     = cat.rows.filter(r=>r.st==='cpu').length;
    const total    = cat.rows.length;

    const rows = cat.rows.map((r, ri) => `
      <tr class="feat" data-st="${r.st}" data-name="${(r.name+(r.code||'')).toLowerCase()}" data-cat="${ci}">
        <td class="name">${r.name}${r.code ? `<br><code>${r.code.replace(/</g,'&lt;')}</code>`:''}` +
        `</td>
        <td><span class="badge ${statusClass(r.st)}">${statusLabel(r.st)}</span></td>
        <td class="effort">${effortHtml(r.eff)}</td>
        <td class="phase">${r.phase ? 'Phase '+r.phase : ''}</td>
        <td class="notes">${r.notes}</td>
      </tr>`
    ).join('');

    const div = document.createElement('div');
    div.className = 'cat';
    div.setAttribute('data-ci', ci);
    div.innerHTML = `
      <div class="mini-bar">
        <div class="pb-done"    style="flex:${pDone}"></div>
        <div class="pb-partial" style="flex:${pPartial}"></div>
        <div class="pb-missing" style="flex:${pMissing}"></div>
        <div class="pb-na"      style="flex:${pNa+pCpu}"></div>
      </div>
      <div class="cat-hdr" onclick="toggleCat(${ci})">
        <span class="cat-icon">${cat.icon}</span>
        <h2>${cat.cat}</h2>
        <span class="cat-count">${pDone}/${total} done &nbsp;·&nbsp; ${pMissing} missing</span>
        <span class="cat-toggle" id="tog-${ci}">▾</span>
      </div>
      <div class="cat-body" id="body-${ci}">
        <table>
          <thead><tr>
            <th style="width:30%">Feature / Example</th>
            <th style="width:120px">Status</th>
            <th style="width:90px">Effort</th>
            <th style="width:80px">Phase</th>
            <th>GPU Implementation Notes</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    container.appendChild(div);
  });

  // master progress bar
  const total = totalAll;
  document.getElementById('masterBar').innerHTML =
    `<div class="pb-done"    style="flex:${totalDone}"></div>` +
    `<div class="pb-partial" style="flex:${totalPartial}"></div>` +
    `<div class="pb-missing" style="flex:${totalMissing}"></div>` +
    `<div class="pb-na"      style="flex:${totalNa+totalCpu}"></div>`;
  document.getElementById('pct-done').textContent    = totalDone + ' (' + pct(totalDone,total) + '%)';
  document.getElementById('pct-partial').textContent = totalPartial + ' (' + pct(totalPartial,total) + '%)';
  document.getElementById('pct-missing').textContent = totalMissing + ' (' + pct(totalMissing,total) + '%)';
  document.getElementById('pct-cpu').textContent     = totalCpu + ' (' + pct(totalCpu,total) + '%)';
  document.getElementById('pct-na').textContent      = totalNa + ' (' + pct(totalNa,total) + '%)';

  applyFilters();
}

function pct(n, total) { return total ? Math.round(n*100/total) : 0; }

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  let vis = 0, tot = 0;
  document.querySelectorAll('tr.feat').forEach(row => {
    const stMatch = currentFilter === 'all' || row.dataset.st === currentFilter;
    const qMatch  = !q || row.dataset.name.includes(q) || row.querySelector('.notes')?.textContent.toLowerCase().includes(q);
    const show = stMatch && qMatch;
    row.classList.toggle('hidden', !show);
    tot++;
    if (show) vis++;
  });
  document.getElementById('stats').textContent = `${vis} / ${tot} features`;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  document.querySelector('.f-'+f)?.classList.add('active');
  applyFilters();
}

function toggleCat(ci) {
  const body = document.getElementById('body-'+ci);
  const tog  = document.getElementById('tog-'+ci);
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  tog.textContent = open ? '▸' : '▾';
}

render();
</script>
</body>
