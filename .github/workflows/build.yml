name: Build Engine & Deploy Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.14
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "nvrtc", "cuda_profiler_api"]'

      - name: Configure CMake
        run: cmake -B engine/build -S engine -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
        working-directory: ${{ github.workspace }}

      - name: Build engine
        run: cmake --build engine/build --config Release
        working-directory: ${{ github.workspace }}

      - name: Upload sym.exe
        uses: actions/upload-artifact@v4
        with:
          name: sym-windows-x64
          path: engine/build/Release/sym.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.14
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "nvrtc"]'

      - name: Configure CMake
        run: cmake -B engine/build -S engine -DCMAKE_BUILD_TYPE=Release

      - name: Build engine
        run: cmake --build engine/build --config Release

      - name: Upload sym binary
        uses: actions/upload-artifact@v4
        with:
          name: sym-linux-x64
          path: engine/build/sym

  deploy-site:
    runs-on: ubuntu-latest
    needs: []   # deploy independently — site doesn't need the engine build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
