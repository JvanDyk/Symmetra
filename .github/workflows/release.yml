name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      exe-path: ${{ steps.build.outputs.exe-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: microsoft/setup-cmake@v3
      
      - name: Configure
        run: |
          cd engine\build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cd engine\build
          cmake --build . --config Release --parallel 8
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: sym-windows-x64
          path: engine\build\Release\sym.exe
          retention-days: 1

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    outputs:
      bin-path: ${{ steps.build.outputs.bin-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-cmake@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cuda-toolkit-12-1
      
      - name: Configure
        run: |
          mkdir -p engine/build-linux
          cd engine/build-linux
          cmake .. -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cd engine/build-linux
          cmake --build . --config Release --parallel 8
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: sym-linux-x64
          path: engine/build-linux/sym
          retention-days: 1

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: sym-linux-x64
      
      - name: Run tests
        run: |
          chmod +x ./sym
          cd engine/build-linux
          ctest -C Release --output-on-failure -j8

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: sym-windows-x64
          path: windows-build
      - uses: actions/download-artifact@v3
        with:
          name: sym-linux-x64
          path: linux-build
      
      - name: Create ZIP package
        run: |
          mkdir -p windows
          cp windows-build/sym.exe windows/
          cp public/install.ps1 windows/
          cd windows && zip -r ../symmetra-${{ github.ref_name }}-windows-x64.zip . && cd ..
      
      - name: Create DEB package
        run: |
          mkdir -p deb/DEBIAN deb/usr/local/bin
          cp linux-build/sym deb/usr/local/bin/
          chmod +x deb/usr/local/bin/sym
          cat > deb/DEBIAN/control << EOF
          Package: symmetra
          Version: ${{ github.ref_name }}
          Architecture: amd64
          Maintainer: Symmetra <info@symmetra.io>
          Depends: libc6 (>= 2.31)
          Description: GPU-accelerated TypeScript server runtime
          EOF
          dpkg-deb --build deb symmetra-${{ github.ref_name }}-linux-x64.deb
      
      - name: Create RPM package
        run: |
          mkdir -p rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          cat > rpmbuild/SPECS/symmetra.spec << 'EOF'
          Name: symmetra
          Version: ${{ github.ref_name }}
          Release: 1
          Summary: GPU-accelerated TypeScript server runtime
          License: MIT
          
          %description
          GPU-accelerated TypeScript server runtime
          
          %prep
          %build
          %install
          mkdir -p %{buildroot}/usr/local/bin
          cp ${{ github.workspace }}/linux-build/sym %{buildroot}/usr/local/bin/
          chmod +x %{buildroot}/usr/local/bin/sym
          
          %files
          /usr/local/bin/sym
          
          %changelog
          EOF
          rpmbuild -bb rpmbuild/SPECS/symmetra.spec --define "_topdir $(pwd)/rpmbuild"
          mv rpmbuild/RPMS/x86_64/*.rpm symmetra-${{ github.ref_name }}-linux-x64.rpm
      
      - name: Calculate checksums
        run: |
          sha256sum symmetra-*.* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            symmetra-${{ github.ref_name }}-windows-x64.zip
            symmetra-${{ github.ref_name }}-linux-x64.deb
            symmetra-${{ github.ref_name }}-linux-x64.rpm
            SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
